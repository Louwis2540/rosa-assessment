name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: rosa-assessment-app
  REGION: asia-southeast1
  SERVICE: rosa-assessment
  IMAGE: asia-southeast1-docker.pkg.dev/rosa-assessment-app/rosa/rosa-assessment
  GCS_BUCKET: rosa-assessment-images

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 -c "
          import os, yaml
          env = {
              'GOOGLE_SHEET_ID': os.environ['GOOGLE_SHEET_ID'],
              'GOOGLE_DRIVE_FOLDER_ID': os.environ['GOOGLE_DRIVE_FOLDER_ID'],
              'ADMIN_PASSWORD': os.environ['ADMIN_PASSWORD'],
          }
          with open('/tmp/env.yaml', 'w') as f:
              yaml.dump(env, f)
          "
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file /tmp/env.yaml \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3 \
            --execution-environment gen2 \
            --service-account rosa-app@$PROJECT_ID.iam.gserviceaccount.com \
            --add-volume=name=rosa-images,type=cloud-storage,bucket=$GCS_BUCKET \
            --add-volume-mount=volume=rosa-images,mount-path=/app/static/images/rosa
